<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — zeroto1.academy</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="brand" aria-label="zeroto1.academy home">
        <span class="brand-mark">0→1</span>
        <span class="brand-text">
          <span class="brand-name">zeroto1.academy</span>
          <span class="brand-tag">Lessons for curious kids</span>
        </span>
      </a>
      <div class="nav-actions">
        <a href="/sign-up" class="nav-action">Sign up</a>
      </div>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue learning.</p>

      <form onsubmit="event.preventDefault(); alert('Demo only — wire this to your auth backend.');">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="button button-primary">Sign in →</button>
      </form>

      <div class="auth-alt">New here? <a href="/sign-up">Create an account</a></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark">0→1</span>
        <span>zeroto1.academy</span>
      </div>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="/">Home</a>
        <a href="/pricing">Pricing</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </nav>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
</body>
</html>
